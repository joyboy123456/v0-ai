# pm2 logrotate 配置 - yibai-fission 日志轮转
# 防止日志撑爆磁盘（5人使用，图片生成日志量大）
#
# 安装方式（二选一）：
# 方式1（推荐，pm2 内置模块）：
#   pm2 install pm2-logrotate
#   pm2 set pm2-logrotate:max_size 10MB
#   pm2 set pm2-logrotate:retain 30
#   pm2 set pm2-logrotate:compress true
#   pm2 set pm2-logrotate:dateFormat YYYY-MM-DD_HH-mm-ss
#
# 方式2（系统 logrotate）：
#   cp scripts/logrotate-yibai.conf /etc/logrotate.d/yibai-fission
#   logrotate /etc/logrotate.d/yibai-fission --state /var/lib/logrotate/logrotate.status

/opt/yibai-fission/logs/*.log {
    daily
    rotate 30
    size 10M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d-%H%M%S
}
